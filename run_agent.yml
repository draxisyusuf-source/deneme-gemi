name: Gemi Takip Ajani TEST

on:
  workflow_dispatch:   # TEST: sadece elle çalışır, zamanlayıcı yok

permissions:
  contents: write

concurrency:
  group: gemi-ajani-test
  cancel-in-progress: false

jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu Kopyala (Checkout)
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Gemi Ajani Scriptini Çalıştır
        env:
          AISSTREAM_API_KEY: ${{ secrets.AISSTREAM_API_KEY }}
          GONDEREN_MAIL: ${{ secrets.EMAIL_USER }}
          SIFRE: ${{ secrets.EMAIL_PASSWORD }}
          ALICI_MAIL: ${{ secrets.EMAIL_TO }}
        run: python gemi_ajani.py

      - name: Durumu Depoya Kaydet
        if: always()
        run: |
          if [ -f durum.json ]; then
            git config user.name "gemi-ajani-bot"
            git config user.email "gemi-ajani-bot@users.noreply.github.com"
            git add durum.json
            git diff --cached --quiet || (git commit -m "durum güncellendi" && git push)
          fi
